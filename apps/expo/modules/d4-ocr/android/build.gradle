plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.d4ocr'
version = '0.7.10'

android {
  namespace "expo.modules.d4ocr"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation("com.google.mlkit:text-recognition:16.0.1")
  compileOnly project(':react-native-vision-camera')
  // react-native-vision-camera declares this as `implementation`, so it isn't
  // exposed transitively - depend on the same CameraX version directly.
  compileOnly "androidx.camera:camera-core:1.5.0-alpha03"
}
