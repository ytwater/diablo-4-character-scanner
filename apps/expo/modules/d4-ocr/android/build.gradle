plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.d4ocr'
version = '0.7.10'

android {
  namespace "expo.modules.d4ocr"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation("com.google.mlkit:text-recognition:16.0.1")
  // Frame/FrameProcessorPlugin/VisionCameraProxy/Orientation live in this
  // project (react-native-vision-camera's Android sources are autolinked as
  // a Gradle project, not a Maven artifact). compileOnly because the host
  // app always provides it at runtime -- we don't want to duplicate/repackage it.
  compileOnly(project(":react-native-vision-camera"))
}
