<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diablo 4 Character Scanner</title>
    <script>
      (function () {
        var stored = localStorage.getItem("theme-mode") || "auto";
        var valid = ["light", "dark", "auto"].includes(stored) ? stored : "auto";
        if (valid === "auto") {
          var auto = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          document.documentElement.classList.add(auto, "auto");
        } else {
          document.documentElement.classList.add(valid);
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground min-h-screen font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
